# 对应教程练习 L9：打 tag 自动发布 Release
# 用法：git tag v1.0.1 && git push origin v1.0.1
name: 04-Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # 创建 GitHub Release 需要写权限（仅此工作流放大权限）

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: 打包构建产物
        run: |
          tar -czf cicd-demo-${GITHUB_REF_NAME}.tar.gz -C dist .
          ls -lh cicd-demo-${GITHUB_REF_NAME}.tar.gz
      - name: 创建 GitHub Release 并上传产物
        uses: softprops/action-gh-release@v2
        with:
          files: cicd-demo-${{ github.ref_name }}.tar.gz
          generate_release_notes: true # 自动根据 PR/提交生成变更说明
